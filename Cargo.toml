[workspace]
resolver = "2"
members = [
    "crates/arnauth-core",
    "crates/arnauth-cli",
    "crates/arnauth-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
repository = "https://github.com/8b-is/arnauth"

[workspace.dependencies]
arnauth-core = { path = "crates/arnauth-core" }
wupz-core = { path = "../wupz/wupz-rs" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1", features = ["getrandom", "zeroize"] }

dirs = "6"
clap = { version = "4", features = ["derive"] }
eframe = "0.32"
